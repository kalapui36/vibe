<!doctype html><html lang="ko"><head><meta name="vibe-runtime" content="pages"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>관리자 · 3색 바이브코딩</title><link rel="icon" href="./public/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./public/style.css"><link rel="stylesheet" href="./public/admin.css"><script type="module" src="./public/admin.js"></script></head>
<body class="admin-page"><header class="site-header"><a class="brand" href="./"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>3색 바이브코딩</span><span class="admin-badge">ADMIN</span></a><a class="admin-link" href="./">공개 페이지 ↗</a></header>
<main id="admin-main"><div class="empty-state"><span class="loader"></span><p>관리자 화면을 불러오는 중입니다.</p></div></main>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="editor"><form id="app-form"><div class="dialog-header"><div><span class="eyebrow muted">WEB APP</span><h2 id="editor-title">웹앱 추가</h2></div><button class="icon-button" type="button" id="close-editor" aria-label="닫기">×</button></div><label class="field">이름 <span class="required">*</span><input name="name" maxlength="80" required placeholder="웹앱 이름"></label><label class="field">기본 주소 <span class="required">*</span><input name="url" type="url" required placeholder="https://"></label><label class="field primary-label-field">기본 주소 이름 <span class="field-optional">선택</span><input name="primary_label" maxlength="40" placeholder="예: 학생용, 프로그램"></label><div class="related-heading"><h3>관련 주소</h3><button type="button" class="text-button" id="add-link">＋ 주소 추가</button></div><p class="field-hint">교사용 설정, 사용 안내 등 추가 주소를 등록합니다. 위에서부터 표시됩니다.</p><div id="related-links"></div><div class="field">분류 <span class="required">*</span><div class="category-options"><label><input type="radio" name="category" value="class" required checked><span><i class="dot blue-dot"></i>수업</span></label><label><input type="radio" name="category" value="mind"><span><i class="dot green-dot"></i>사회정서교육</span></label><label><input type="radio" name="category" value="work"><span><i class="dot purple-dot"></i>업무</span></label></div></div><label class="field">설명<textarea name="description" maxlength="240" rows="3" placeholder="어디에 쓰는 웹앱인지 짧게 적어 주세요."></textarea></label><div class="field">썸네일 <span class="field-optional">선택</span><div id="image-preview" class="editor-preview"></div><p id="image-read-status" class="field-hint" role="status"></p><label class="upload-button" for="thumbnail-file">이미지 선택<input id="thumbnail-file" type="file" accept="image/png,image/jpeg,image/webp" hidden></label><button class="text-button" id="reset-thumbnail" type="button">자동 썸네일 사용</button><p class="field-hint">미지정 시 웹앱의 첫 화면을 자동 캡처합니다. JPG, PNG, WebP · 최대 4MB</p></div><label class="visibility-field"><span><b>공개 페이지에 표시</b><small>끄면 공개 목록에서 제외합니다.</small></span><input name="visible" type="checkbox" role="switch" checked></label><p class="form-error" id="editor-error" role="alert"></p><div class="dialog-actions"><button class="button secondary" type="button" id="cancel-editor">취소</button><button class="button secondary" type="button" id="reload-editor" hidden>최신 내용 불러오기</button><button class="button primary" id="save-app" type="submit">저장</button></div></form></dialog>
<dialog id="delete-dialog"><form method="dialog"><h2>웹앱을 삭제할까요?</h2><p id="delete-message"></p><p class="field-hint">삭제한 항목은 복구할 수 없습니다.</p><div class="dialog-actions"><button class="button secondary" value="cancel">취소</button><button class="button danger" value="delete">삭제</button></div></form></dialog>
</body></html>
