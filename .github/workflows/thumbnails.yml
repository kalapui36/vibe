name: Update thumbnails
on:
  push:
    branches: [main]
    paths: ['content/apps.json']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: thumbnails
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Capture pending apps
        run: node scripts/capture-pages.js
      - name: Save thumbnails
        id: save
        run: |
          git add content/apps.json content/thumbnails/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update web app thumbnails"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Refresh branch-based GitHub Pages
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
