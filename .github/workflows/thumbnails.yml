name: Update thumbnails
on:
  push:
    branches: [main]
    paths: ['content/apps.json']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: thumbnails
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check pending screenshots
        id: pending
        run: |
          python3 - <<'PYCODE'
          import json, os
          with open('content/apps.json') as source:
              pending = any(row.get('capture_status') == 'pending' for row in json.load(source))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('any=' + str(pending).lower() + '\n')
          PYCODE
      - uses: actions/setup-node@v4
        if: steps.pending.outputs.any == 'true'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        if: steps.pending.outputs.any == 'true'
      - run: npx playwright-core install --with-deps chromium
        if: steps.pending.outputs.any == 'true'
      - name: Check address validation and catalog migration
        if: steps.pending.outputs.any == 'true'
        run: node --test test/links.test.js
      - name: Capture pending apps
        if: steps.pending.outputs.any == 'true'
        run: node scripts/capture-pages.js
      - name: Save thumbnails
        if: steps.pending.outputs.any == 'true'
        id: save
        run: |
          git add content/apps.json content/thumbnails/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update web app thumbnails"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Refresh branch-based GitHub Pages
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
